<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Warden — Overview</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="/styles.css" rel="stylesheet" />
</head>
<body class="text-on-surface font-body-md bg-background antialiased min-h-screen flex">
<nav class="fixed left-0 top-0 h-screen w-64 flex flex-col pt-10 pb-8 z-40 border-r border-white/10 bg-surface-container-lowest">
<div class="px-6 mb-10">
<div class="font-headline-md text-headline-md font-black tracking-widest text-on-surface">WARDEN</div>
<div class="font-mono-label text-mono-label text-on-surface-variant mt-1">Compliance Rail v1.0</div>
</div>
<div class="flex-1 flex flex-col gap-2 px-4">
<a class="flex items-center gap-3 px-4 py-3 rounded-lg bg-secondary-container/20 text-secondary-fixed-dim border-l-4 border-secondary-fixed-dim" href="/overview.html">
<span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">dashboard</span><span class="font-mono-label text-mono-label">Overview</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/30 transition-all" href="/">
<span class="material-symbols-outlined">security</span><span class="font-mono-label text-mono-label">Control Center</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/30 transition-all" href="/create.html">
<span class="material-symbols-outlined">add_circle</span><span class="font-mono-label text-mono-label">Create Agent</span>
</a>
</div>
</nav>
<main class="ml-64 flex-1 flex flex-col min-h-screen">
<header class="h-24 border-b border-white/10 bg-surface-container/10 backdrop-blur-md flex items-center px-gutter sticky top-0 z-30">
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Overview</h1>
<p class="font-mono-hash text-mono-hash text-on-surface-variant mt-1">The compliance rail for autonomous AI agents.</p>
</div>
</header>
<div class="p-gutter flex flex-col gap-gutter">
<div class="grid grid-cols-2 lg:grid-cols-4 gap-gutter">
<div class="glass-card rounded-xl p-6"><div class="font-mono-label text-mono-label text-on-surface-variant">AGENTS</div><div id="s-agents" class="font-headline-lg text-headline-lg text-on-surface mt-2">0</div></div>
<div class="glass-card rounded-xl p-6"><div class="font-mono-label text-mono-label text-on-surface-variant">AUTHORIZED</div><div id="s-auth" class="font-headline-lg text-headline-lg text-emerald-400 mt-2">0</div></div>
<div class="glass-card rounded-xl p-6"><div class="font-mono-label text-mono-label text-on-surface-variant">BLOCKED</div><div id="s-blocked" class="font-headline-lg text-headline-lg text-error mt-2">0</div></div>
<div class="glass-card rounded-xl p-6"><div class="font-mono-label text-mono-label text-on-surface-variant">SANCTIONED (FROZEN)</div><div id="s-frozen" class="font-headline-lg text-headline-lg text-error mt-2">0</div></div>
</div>
<div class="glass-card rounded-xl p-6 flex flex-col gap-3">
<h2 class="font-headline-md text-headline-md text-on-surface">Blocked reasons</h2>
<div id="reasons" class="flex flex-col gap-2 font-mono-hash text-mono-hash"></div>
</div>
</div>
</main>
<script src="/overview.js"></script>
</body>
</html>
